# Production deployment. `deploy/install.sh` installs Docker (if missing) and
# host audio prerequisites, then runs `docker compose up -d` - this file is
# the whole stack from there. For a source+systemd deployment instead (no
# Docker at all), see deploy/install-source.sh and the README's Deployment
# section.
#
# Default services (`docker compose up -d`, no profile) are just `app` +
# `caddy` - enough to log in and configure cloud STT/LLM providers with no
# large downloads and no extra host setup. `speaches` (self-hosted STT) and
# `diarization` (self-hosted diarization) are opt-in via profiles, since both
# need real setup of their own (a multi-GB model download, or ONNX model
# files you provide) that a first-run shouldn't be blocked on:
#   docker compose --profile local-stt up -d
#   docker compose --profile diarization up -d
# (`COMPOSE_PROFILES=local-stt,diarization` in .env works too, for a
# permanent default without typing the flag every time.)
#
# There is a third profile, `wud`, and it is opt-in for a different reason
# than those two: not a download, but host access. It hands a container the
# Docker socket so it can replace this stack's `app` container with a newer
# published image. Read the README section "Updating" before enabling it - it
# is an alternative to deploy/update.sh, not an upgrade over it, and it is off
# unless you ask for it by name.

services:
  app:
    build: .
    # Published by .github/workflows/docker-publish.yml on every push to main,
    # for linux/amd64 and linux/arm64. Both `build:` and `image:` on one
    # service on purpose, and the order of precedence is unchanged: `up -d
    # --build` (what deploy/install.sh and deploy/update.sh run) still builds
    # from this checkout and simply tags the result with this name. What the
    # `image:` line adds is that `docker compose pull` now has something to
    # fetch instead of printing "Skipped - No image to be pulled", which is
    # what the optional wud service below needs to exist at all.
    #
    # The image does not exist until that workflow has actually run on GitHub,
    # and a GHCR package is private on first publish - so until it is switched
    # to public, pulling it needs `docker login ghcr.io` first.
    image: ghcr.io/luckytype/loreline:latest
    labels:
      # Read by the optional wud service below (it runs with
      # WATCHBYDEFAULT=false, so an unlabelled container is ignored entirely -
      # that is WUD's only container-scoping mechanism, there is no name or
      # regex filter on the watcher). This is the only container in this file
      # that carries it, deliberately: Caddy, the docker proxy, the STT server
      # and the diarizer are other people's images, and replacing those on a
      # box that holds session audio is a different risk nobody here reviewed.
      wud.watch: "true"
    ports:
      - "${LORELINE_PORT:-8000}:8000"
    # deploy/install.sh writes .env (login password, port). Optional so a bare
    # `docker compose up -d` in a fresh clone still works without one.
    env_file:
      - path: .env
        required: false
    environment:
      LORELINE_HOST: 0.0.0.0
      LORELINE_ENVIRONMENT: prod
      LORELINE_LOG_JSON: "true"
      # Unset this to turn Settings > Services off entirely.
      LORELINE_DOCKER_API: http://docker-proxy:2375
      # Lets the web UI's "Update now" button drive the optional wud service
      # below, over the compose network. Note what this is not: the app still
      # has no Docker socket and no path to one. It sends two authenticated
      # HTTP requests to a container that already holds that access for its own
      # reason, and learns nothing back beyond whether an update exists - the
      # boundary described at the bottom of this file is unmoved. The username
      # is the same .env entry WUD reads below, so the two halves can't drift
      # apart; the password is the plaintext whose hash WUD holds, because
      # HTTP Basic has the client send the password itself. Empty (the default)
      # leaves the button reporting that updates run from the host, as before.
      LORELINE_WUD_USER: ${WUD_AUTH_USER:-}
      LORELINE_WUD_PASSWORD: ${WUD_AUTH_PASSWORD:-}
      # Peers whose X-Forwarded-Proto this app believes when it decides whether
      # to mark the login cookie Secure. This is the private range Compose puts
      # its own network in, so it covers the caddy service below - and, what
      # matters more, it does not cover a LAN client arriving on the port
      # published above, which therefore cannot claim its plain-HTTP connection
      # was TLS. Drop this line if you drop the caddy service: with it unset the
      # app trusts no forwarded header and reads the scheme off the connection.
      LORELINE_TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - ./data:/app/data
    # Real microphone capture needs the host's audio device node passed
    # through - Linux hosts only. Docker Desktop on macOS/Windows runs
    # containers in a Linux VM with no path to the host's native audio
    # devices (CoreAudio/WASAPI aren't exposed across that boundary at all),
    # so this can't work there regardless of what's uncommented here - comment
    # this out there (or on a Linux box with no local mic at all).
    devices:
      - /dev/snd:/dev/snd
    # Bluetooth audio (or any PipeWire/PulseAudio-routed source, e.g. a mic
    # that only shows up as a "Default Source", not a raw ALSA hw: device)
    # isn't reachable via /dev/snd at all - it's routed through the host's
    # userspace audio session. Uncomment both lines below AND run
    # `deploy/setup-bluetooth-audio.sh` on the host first (pairs the device,
    # sets up PipeWire for a service-account-style session with no real
    # login). $XDG_RUNTIME_DIR must match the uid that script's PipeWire
    # instance actually runs as - it prints the right value at the end.
    # volumes:
    #   - /run/user/1000/pulse:/run/user/1000/pulse
    # environment:
    #   XDG_RUNTIME_DIR: /run/user/1000
    restart: unless-stopped

  # Lets Settings > Services list the stack, read container logs, and
  # start/stop the optional services - without handing the app the raw Docker
  # socket, which is root-equivalent on the host. Allowlists five endpoints by
  # exact path and refuses everything else; see deploy/docker-proxy.Caddyfile
  # for why a path-level allowlist is required here. Not published to the
  # host - only the app can reach it, over the compose network.
  docker-proxy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy/docker-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Reverse proxy for reaching the app on standard ports across the LAN, with
  # TLS termination so the login password isn't sent in the clear (see
  # ./Caddyfile). Optional - the app is equally reachable directly on :8000
  # without it.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Self-hosted STT (OpenAI-compatible, faster-whisper). On the compose
  # network the app reaches it at http://speaches:8000/v1; host port 8200
  # avoids colliding with the app's 8000. First start downloads the model
  # (a few GB) - opt in with `docker compose --profile local-stt up -d`.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["local-stt"]
    ports:
      - "8200:8000"
    # This image ships with NO models, and does not download one on demand:
    # transcription 404s with "Model '...' is not installed locally" while
    # GET /v1/models still answers 200 with an empty list - which reads like
    # the service is fine. Install one once (persists in speaches-hub):
    #
    #   curl -X POST http://localhost:8200/v1/models/Systran/faster-whisper-large-v3
    #
    # Note WHISPER__MODEL and PRELOAD_MODELS do NOT work here despite
    # appearing in the upstream docs - this build's settings object has
    # neither field, so both are silently ignored (verified against the
    # running container's own config dump).
    volumes:
      - speaches-hub:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  # Self-hosted diarization service (sherpa-onnx). Needs real ONNX model
  # files under ./models (not provided) - opt in with
  # `docker compose --profile diarization up -d`, then configure a `remote`
  # diarizer at http://diarization:8001.
  diarization:
    build: ./services/diarization
    profiles: ["diarization"]
    ports:
      - "8001:8001"
    environment:
      - DIAR_SEGMENTATION_MODEL=/models/sherpa-onnx-pyannote-segmentation-3-0/model.onnx
      - DIAR_EMBEDDING_MODEL=/models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  # Opt-in registry updates, for people who want the box to update itself
  # without a shell on it and without a git checkout:
  #
  #   docker compose --profile wud up -d
  #
  # WUD ("What's Up Docker") polls GHCR for a newer `app` image and can stop
  # the container, pull, and recreate it with the same config. That is a
  # different mechanism from deploy/update.sh (git pull + rebuild on a systemd
  # timer), not a better one - see the README section "Updating" for the choice
  # between them. Running both is the one combination to avoid: update.sh
  # rebuilds the image locally and WUD replaces it with the registry one, so
  # each undoes the other on its own schedule and the container is recreated
  # more often than either alone.
  #
  # Note what this profile does by default, because it changed: detection runs
  # on the cron below, but *applying* an update waits for the web UI's Update
  # button (WUD_TRIGGER_DOCKER_LOCAL_AUTO below is false). Set WUD_AUTO_UPDATE
  # in .env to restore unattended updates at that cron time.
  #
  # What you are agreeing to by starting it: this container gets the raw Docker
  # socket, which is root-equivalent on the host. It cannot go behind
  # deploy/docker-proxy.Caddyfile the way the app does, because that proxy
  # exists specifically to refuse POST /containers/create, and creating
  # containers is the entire job here. The mount below is deliberately not
  # `:ro`: a read-only bind mount of a *unix socket* does not make the socket
  # read-only anyway (the kernel's read-only check covers regular files,
  # directories and symlinks, not socket I/O), so the flag would only imply a
  # limit that isn't there, and WUD's own compose examples don't use it. What
  # actually limits the blast radius is the label filter, not a mount flag.
  #
  # Why this and not watchtower, which used to be here: containrrr/watchtower
  # was archived in December 2025, and its last release, 1.7.1 from November
  # 2023, does not work on a current Docker Engine at all - its bundled client
  # negotiates an API version below the 1.44 floor that Engine 29 enforces, so
  # every call is refused. The maintained fork does not disclose being a fork,
  # which is not a thing to hand the Docker socket. WUD is its own project
  # (MIT, active, ~3.8k stars) and talks to Docker through dockerode, which
  # tracks current API versions.
  wud:
    image: getwud/wud:8.4.0
    profiles: ["wud"]
    environment:
      # Container scoping, and the only mechanism WUD has for it: its watcher
      # takes no name filter and no include/exclude regex, just this default
      # plus the `wud.watch` label, which in this file only `app` carries. As
      # with watchtower before it, the scope is the whole Docker host rather
      # than this compose project: another container on the box carrying that
      # same label is fair game too.
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
      # 04:00 daily, in this container's timezone, which is UTC unless TZ is
      # set below. Five fields, ordinary cron - WUD's own default is hourly.
      # A fixed quiet hour because applying an update recreates the app
      # container, which ends a recording that happens to be running. Roughly
      # the cadence of deploy/loreline-update.timer when that is enabled.
      WUD_WATCHER_LOCAL_CRON: "0 4 * * *"
      # false means "detect, but wait to be asked". WUD keeps watching on the
      # cron above and keeps its updateAvailable verdict current; it just does
      # not act on it, so the web UI's Update button is what applies an update
      # (see the app service's LORELINE_WUD_USER, and the README's "Updating").
      # Set WUD_AUTO_UPDATE=true in .env for unattended updates at 04:00.
      WUD_TRIGGER_DOCKER_LOCAL_AUTO: ${WUD_AUTO_UPDATE:-false}
      # Delete the image that was replaced. Not optional in practice: the image
      # is a couple of GB, and without this every update leaves the old copy
      # behind until the Pi's card is full.
      WUD_TRIGGER_DOCKER_LOCAL_PRUNE: "true"
      # HTTP Basic credentials for WUD's own API, which is what the app
      # authenticates with. WUD stores the password only as an htpasswd hash,
      # so .env carries both that hash and the plaintext the app sends;
      # deploy/install.sh generates a matching pair. Leave both unset and WUD
      # allows anonymous access instead, which is survivable only because the
      # port below is not published. Note WUD does not crash on a bad or empty
      # hash the way watchtower did on an empty token: it logs, registers no
      # strategy, and answers 401, and the button reports exactly that.
      WUD_AUTH_BASIC_LORELINE_USER: ${WUD_AUTH_USER:-}
      WUD_AUTH_BASIC_LORELINE_HASH: ${WUD_AUTH_HASH:-}
      TZ: ${TZ:-UTC}
    # Reachable at http://wud:3000 from the other services and from nowhere
    # else: no `ports:` here, deliberately. `expose` publishes nothing -
    # containers on a compose network can already reach each other's ports - it
    # only records which port the app is expected to use. WUD serves a full web
    # UI from this same port with no switch to turn it off, on top of an API
    # that recreates containers, and neither has any business answering the LAN.
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  speaches-hub:
  caddy-data:
  caddy-config:
