# The appliance deployment. `deploy/install.sh` installs Docker (if missing)
# and host audio prerequisites, then runs `docker compose up -d` - this file is
# the whole stack from there. For a source+systemd deployment instead (no
# Docker at all), see deploy/install-source.sh and the README's Deployment
# section.
#
# This is not the shortest way to try Loreline, and nothing in here is required
# to run it. The app is one container that serves the API and the web UI on
# port 8000 by itself:
#
#   docker run -d --name loreline -p 8000:8000 -v loreline-data:/app/data \
#     ghcr.io/luckytype/loreline:latest
#
# What this file adds on top of that is the appliance: a reverse proxy on 80
# and 443, a read-only window onto the Docker API so Settings > Services works,
# and the optional self-hosted STT, diarization and updater services. Read the
# README's Quickstart before this file if you have not run Loreline yet.
#
# Default services (`docker compose up -d`, no profile) are `app`,
# `docker-proxy` and `caddy` - enough to log in and configure cloud STT/LLM
# providers with no large downloads and no extra host setup. `speaches` (self-hosted STT) and
# `diarization` (self-hosted diarization) are opt-in via profiles, since both
# need real setup of their own (a multi-GB model download, or ONNX model
# files you provide) that a first-run shouldn't be blocked on:
#   docker compose --profile local-stt up -d
#   docker compose --profile diarization up -d
# (`COMPOSE_PROFILES=local-stt,diarization` in .env works too, for a
# permanent default without typing the flag every time.)
#
# There is a third profile, `updater`, and it is opt-in for a different reason
# than those two: not a download, but host access. It hands a container the
# Docker socket so it can replace this stack's `app` container with a newer
# published image, which is what makes the web UI's "Update now" button work
# here. Read the README section "Updating" before enabling it - it is an
# alternative to deploy/update.sh, not an upgrade over it, and it is off unless
# you ask for it by name.

services:
  app:
    build:
      context: .
      # What revision the built image reports in Settings > Client. git cannot
      # be asked from inside the container (the image has no .git - see the
      # Dockerfile), so the side that builds has to say. deploy/install.sh and
      # deploy/update.sh read both from this checkout's git and hand them to
      # Compose when they run `up -d --build`; the `:-` defaults keep a bare
      # `docker compose up -d --build` in a clone working, and an image built
      # that way simply reports an unknown revision rather than a wrong one.
      args:
        LORELINE_BUILD_COMMIT: ${LORELINE_BUILD_COMMIT:-}
        LORELINE_BUILD_DESCRIBED: ${LORELINE_BUILD_DESCRIBED:-}
    # Published by .github/workflows/docker-publish.yml on every push to main,
    # for linux/amd64 and linux/arm64. Both `build:` and `image:` on one
    # service on purpose, and the order of precedence is unchanged: `up -d
    # --build` (what deploy/install.sh and deploy/update.sh run) still builds
    # from this checkout and simply tags the result with this name. What the
    # `image:` line adds is that `docker compose pull` now has something to
    # fetch instead of printing "Skipped - No image to be pulled", which is
    # what deploy/update-fast.sh, and the optional updater service below,
    # need to exist at all.
    #
    # The image does not exist until that workflow has actually run on GitHub,
    # and a GHCR package is private on first publish - so until it is switched
    # to public, pulling it needs `docker login ghcr.io` first.
    image: ghcr.io/luckytype/loreline:latest
    ports:
      - "${LORELINE_PORT:-8000}:8000"
    # deploy/install.sh writes .env (login password, port). Optional so a bare
    # `docker compose up -d` in a fresh clone still works without one.
    env_file:
      - path: .env
        required: false
    environment:
      LORELINE_HOST: 0.0.0.0
      LORELINE_ENVIRONMENT: prod
      LORELINE_LOG_JSON: "true"
      # Points at the docker-proxy service below, which only exists in this
      # file. Spelled as an override rather than a literal so a deployment
      # that runs the app on its own can turn Settings > Services off from
      # .env instead of editing this file; the effective default is the same
      # value it has always been. Note `:-` treats an empty value as unset, so
      # blanking it means removing this line or running without this file, not
      # writing `LORELINE_DOCKER_API=` in .env.
      LORELINE_DOCKER_API: ${LORELINE_DOCKER_API:-http://docker-proxy:2375}
      # Lets the web UI's "Update now" button drive the optional updater
      # service below, over the compose network. Note what this is not: the app
      # still has no Docker socket and no path to one. It sends one
      # authenticated HTTP request, carrying no arguments, to a container that
      # already holds that access for its own reason - the boundary described
      # at the bottom of this file is unmoved. Both halves read the same .env
      # entry, so they cannot drift apart. Empty (the default) leaves the
      # button reporting that updates run from the host, as before.
      #
      # Written as ${UPDATER_TOKEN:-} rather than a bare `UPDATER_TOKEN:`,
      # deliberately: the bare form omits the variable from the container
      # entirely when .env does not set it, while this one always delivers it,
      # empty if need be. Both read as "no token" to the code on either side,
      # but only one of them is the same thing twice.
      LORELINE_UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      # Peers whose X-Forwarded-Proto this app believes when it decides whether
      # to mark the login cookie Secure. This is the private range Compose puts
      # its own network in, so it covers the caddy service below - and, what
      # matters more, it does not cover a LAN client arriving on the port
      # published above, which therefore cannot claim its plain-HTTP connection
      # was TLS. Drop this line if you drop the caddy service: with it unset the
      # app trusts no forwarded header and reads the scheme off the connection.
      #
      # It also covers `tailscale serve` on the host, which is how this stack
      # gets a trusted certificate and therefore how a browser can be the
      # microphone (README, "Recording from a laptop"). That proxy is a host
      # process reaching the published port above, so it arrives from the
      # compose bridge gateway, which is inside this range - if you have moved
      # Compose onto a custom address pool, add that pool here or an HTTPS
      # session's login cookie silently loses its Secure flag.
      #
      # Overridable from .env for the same reason as LORELINE_DOCKER_API above,
      # and with the same caveat about an empty value: the default below is
      # unchanged for every deployment that does not set it.
      LORELINE_TRUSTED_PROXIES: ${LORELINE_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - ./data:/app/data
    # No `devices:` here on purpose, and that is the one thing in this file
    # that used to be a hard failure rather than a preference: a `/dev/snd`
    # mount is an error on any host without a sound card, which is most
    # homelab boxes and every Docker Desktop install (macOS and Windows run
    # containers in a Linux VM with no path to CoreAudio or WASAPI, so a host
    # microphone cannot reach a container there at all). The default has to be
    # the one that starts everywhere.
    #
    # A Linux box that *is* the recorder adds the mount back through an
    # override file, which is also what deploy/install.sh writes when it finds
    # /dev/snd on the host. To do it by hand, from this directory:
    #
    #   cp deploy/mic-passthrough.override.yml docker-compose.override.yml
    #   docker compose up -d
    #
    # Delete that file and repeat to turn it off again. It is a separate file
    # rather than a commented-out block here because .gitignore covers it, so
    # `git pull` never conflicts with the choice this box made.
    #
    # A server with no microphone is not a server that cannot record: pick
    # "This device's microphone" in the capture card and the browser you
    # started the session in is the source instead (README, "Recording from a
    # laptop").
    #
    # Bluetooth audio (or any PipeWire/PulseAudio-routed source, e.g. a mic
    # that only shows up as a "Default Source", not a raw ALSA hw: device)
    # isn't reachable via /dev/snd at all - it's routed through the host's
    # userspace audio session. Uncomment both lines below AND run
    # `deploy/setup-bluetooth-audio.sh` on the host first (pairs the device,
    # sets up PipeWire for a service-account-style session with no real
    # login). $XDG_RUNTIME_DIR must match the uid that script's PipeWire
    # instance actually runs as - it prints the right value at the end.
    # volumes:
    #   - /run/user/1000/pulse:/run/user/1000/pulse
    # environment:
    #   XDG_RUNTIME_DIR: /run/user/1000
    restart: unless-stopped

  # Lets Settings > Services list the stack, read container logs, and
  # start/stop the optional services - without handing the app the raw Docker
  # socket, which is root-equivalent on the host. Allowlists five endpoints by
  # exact path and refuses everything else; see deploy/docker-proxy.Caddyfile
  # for why a path-level allowlist is required here. Not published to the
  # host - only the app can reach it, over the compose network.
  docker-proxy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy/docker-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Reverse proxy for reaching the app on standard ports across the LAN, with
  # TLS termination so the login password isn't sent in the clear (see
  # ./Caddyfile). Optional - the app is equally reachable directly on :8000
  # without it.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Self-hosted STT (OpenAI-compatible, faster-whisper). On the compose
  # network the app reaches it at http://speaches:8000/v1; host port 8200
  # avoids colliding with the app's 8000. First start downloads the model
  # (a few GB) - opt in with `docker compose --profile local-stt up -d`.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["local-stt"]
    ports:
      - "8200:8000"
    # This image ships with NO models, and does not download one on demand:
    # transcription 404s with "Model '...' is not installed locally" while
    # GET /v1/models still answers 200 with an empty list - which reads like
    # the service is fine. deploy/install.sh installs one for you when you
    # enable this profile at install time; otherwise, once (persists in
    # speaches-hub):
    #
    #   curl -X POST http://localhost:8200/v1/models/Systran/faster-whisper-small
    #
    # `small`, not `large-v3`, and the reason is a hard limit rather than a
    # preference: SttRouter gives each utterance 30 s (timeout_s in
    # src/loreline/stt/router.py) and large-v3 on a CPU does not come close.
    # Measured on the test box, every single utterance timed out, the run
    # logged `stt.degraded ... Speaches (local): TimeoutError` and wrote no
    # segments at all. `small` is multilingual, which the distil-whisper
    # builds are not (English only), and that matters for a table not playing
    # in English. If your box has the cores for it, `medium` and `large-v3`
    # are the same one-line install.
    #
    # Note WHISPER__MODEL and PRELOAD_MODELS do NOT work here despite
    # appearing in the upstream docs - this build's settings object has
    # neither field, so both are silently ignored (verified against the
    # running container's own config dump).
    volumes:
      - speaches-hub:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  # Self-hosted diarization service (sherpa-onnx). Needs real ONNX model
  # files under ./models (not provided) - opt in with
  # `docker compose --profile diarization up -d`, then configure a `remote`
  # diarizer at http://diarization:8001.
  #
  # One replica, deliberately: it remembers a session's speakers between calls
  # so the labels hold across a whole session, and two of them behind one
  # address would answer with different ones. The knobs for that memory all
  # have defaults; services/diarization/README.md documents them.
  diarization:
    build: ./services/diarization
    profiles: ["diarization"]
    ports:
      - "8001:8001"
    environment:
      - DIAR_SEGMENTATION_MODEL=/models/sherpa-onnx-pyannote-segmentation-3-0/model.onnx
      - DIAR_EMBEDDING_MODEL=/models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  # Opt-in registry updates, for people who want the box to update itself from
  # the web UI without a shell on it:
  #
  #   docker compose --profile updater up -d
  #
  # It is a different mechanism from deploy/update.sh (git pull + rebuild on a
  # systemd timer), not a better one - see the README section "Updating" for the
  # choice between them. Running both is the one combination to avoid: update.sh
  # rebuilds the image locally and this replaces it with the registry one, so
  # each undoes the other on its own schedule.
  #
  # This is Loreline's own, which is the third answer this feature has had and
  # the reason it stopped being someone else's. containrrr/watchtower was
  # archived upstream and its bundled Docker client negotiates below the API
  # 1.44 floor Engine 29 enforces, so on the real box every call it made was
  # refused. WUD, which replaced it, started cleanly but cannot see
  # ghcr.io/luckytype/loreline even now that the package is public: its GHCR
  # provider never performs the anonymous OCI token exchange, sending a
  # placeholder where a bearer token belongs, so it demands an access token for
  # a package that needs none. Both faults were the same fault - a
  # reimplementation of something Docker already does correctly. This service
  # reimplements nothing. It runs deploy/update-fast.sh, which runs the real
  # `docker` and `docker compose` CLIs. See services/updater/updater.py; it is
  # deliberately one short file, because of what it is mounted with.
  #
  # What you are agreeing to by starting it: this container gets the raw Docker
  # socket, which is root-equivalent on the host. It cannot go behind
  # deploy/docker-proxy.Caddyfile the way the app does, because that proxy
  # exists specifically to refuse POST /containers/create, and creating
  # containers is the entire job here. The socket mount is deliberately not
  # `:ro`: a read-only bind mount of a *unix socket* does not make the socket
  # read-only anyway (the kernel refuses writes to regular files, directories
  # and symlinks on a read-only mount, not the connect-and-send path a socket is
  # actually used through), so the flag would only imply a limit that isn't
  # there. For the same reason the repo mount below is not narrowed to a handful
  # of files: a container holding the socket can start another container with
  # any mount it likes, so trimming its own would be decoration, not a boundary.
  #
  # What does limit it is the shape of the endpoint. This service answers
  # exactly one route, POST /update, and that route takes no arguments at all -
  # no image, no tag, no container id, no command - so the most a leaked token
  # buys is the update the button already performs. And that update names one
  # service, `app`, so Caddy, the docker proxy, the STT server and the diarizer
  # are never candidates. Both predecessors scoped themselves with a label
  # instead, which is host-wide: any other container on the box carrying it was
  # fair game too. This one cannot be asked about another container at all.
  #
  # It never updates itself, which is the simplification that makes an honest
  # answer possible: the container running the update is not the container being
  # replaced. The flip side is that a release which changes this service is not
  # applied by the button - run
  # `docker compose --profile updater up -d --build updater` on the host for
  # that, as the README's "Updating" section says.
  updater:
    build: ./services/updater
    profiles: ["updater"]
    environment:
      # The same .env entry the app service reads above, so the two halves
      # cannot drift apart. Empty means no token is configured, and every
      # request is refused with a message saying exactly that - an unset token
      # is never a way in.
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      # This checkout's path on the host, mounted below at that same path inside
      # the container. The equality is load-bearing and not tidiness: this
      # container drives the *host's* daemon, so the relative bind mounts in this
      # file (./data, ./Caddyfile) are resolved against the project directory
      # here and then handed to the host to interpret. Mount the repo at some
      # other path and the recreated app container would bind a host path that
      # does not exist, which Docker would helpfully create, empty - and the app
      # would come back appearing to have lost every session. The same equality
      # is also what makes Compose derive the same project name on both sides,
      # so this updates the running stack instead of starting a second one
      # beside it.
      #
      # /opt/loreline is where the README and deploy/install.sh put it. Set
      # UPDATER_REPO_DIR in .env if this checkout lives anywhere else - the
      # service refuses to run, naming that variable, rather than guess.
      UPDATER_REPO_DIR: ${UPDATER_REPO_DIR:-/opt/loreline}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-write, which the `git pull --ff-only` half of the update needs;
      # everything after that only reads. Note that git runs here as root
      # against a checkout owned by whoever cloned it, so objects and files it
      # writes end up root-owned. A later host-side `git pull` still works -
      # git creates and renames rather than writing existing files in place -
      # but `ls -l` in the checkout will show a mixture.
      - ${UPDATER_REPO_DIR:-/opt/loreline}:${UPDATER_REPO_DIR:-/opt/loreline}
    # Reachable at http://updater:8080 from the other services and from nowhere
    # else: no `ports:` here, deliberately. `expose` publishes nothing -
    # containers on a compose network can already reach each other's ports - it
    # only records which port the app is expected to use.
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  speaches-hub:
  caddy-data:
  caddy-config:
