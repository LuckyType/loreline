# Which providers and models loreline offers, and what each one can do.
#
# THIS FILE IS THE SOURCE OF TRUTH for compatible provider+model combinations.
# Both the Python backend and the browser read it (the frontend over
# /api/capabilities), so a capability is written down exactly once. It replaces
# the hand-maintained tables that used to live in loreline/capabilities.py and,
# duplicated by hand, in frontend/src/lib/types.ts.
#
# It is NOT a gate on what exists. The live provider APIs stay authoritative for
# what is reachable today; this file says what a model can *do* and which ones
# we vouch for. A model absent from here is unknown, never unsupported, and the
# strict-filtering setting decides whether unknown models are offered.
#
# One model per provider and interaction carries `default: true`: the model
# this file vouches for when a connector must name one and nobody chose. It is
# scoped by interaction because a provider row serves several at once, and it
# is marked rather than inferred from list order so reordering a list cannot
# silently change what runs. The loader enforces exactly one per offered
# interaction and refuses a hidden or retiring model, which is what makes the
# stale connector constants this replaced impossible to reintroduce.
#
# Researched against official vendor documentation on 2026-09-02. Per-claim doc
# URLs are kept inline as comments. Schema and validation rules live in
# loreline/capability_config.py; every rule there exists because getting a leaf
# wrong here shows up as a missing or dead control in the UI rather than as an
# error.

version: 1

# Fallback name matching for catalogues that publish no capability metadata at
# all: OpenAI's /models mixes every modality into one list, and a self-hosted
# server's list is whatever the operator named their files. Used only when a
# model has no entry above, and never allowed to empty a picker.
transcribe_name_markers:
  - whisper
  - transcribe
  - parakeet
  - asr
  - stt
  - voxtral
  - nova
  - chirp

# Both vendors that split a catalogue across two transports put the transport in
# the model name, so this is the fallback when a mixed-transport model is not
# curated above. Misrouting a new streaming model to the batch endpoint would
# fail anyway, so the guess costs nothing.
realtime_name_markers:
  - live
  - realtime

providers:
  deepgram:
    label: Deepgram
    hosting: cloud
    auth: api_key
    # "You must create your first API key using the Deepgram Console."
    # https://developers.deepgram.com/docs/create-additional-api-keys
    key_url: https://console.deepgram.com/signup?jump=keys
    # POST https://api.deepgram.com/v1/listen (batch), wss://api.deepgram.com/v1/listen (Nova streaming),
    # wss://api.deepgram.com/v2/listen (Flux streaming)
    # https://developers.deepgram.com/reference/speech-to-text/listen-pre-recorded.md
    # https://developers.deepgram.com/reference/speech-to-text-api/listen-streaming
    # https://developers.deepgram.com/docs/flux/quickstart
    base_url: https://api.deepgram.com
    # GET https://api.deepgram.com/v1/models -- returns STT models with name/canonical_name/uuid/
    # architecture/languages/version. Requires "Authorization: Token <key>".
    # https://developers.deepgram.com/reference/manage/models/list
    catalog_endpoint: https://api.deepgram.com/v1/models
    interactions: [transcribe]
    models:
      - id: nova-3
        label: Nova-3
        interactions: [transcribe]
        # Deepgram's current flagship, and the only one taking the modern
        # `keyterm` biasing field - the constant this replaces still named
        # nova-2, which silently fell back to legacy `keywords`.
        default: true
        transcribe:
          # https://developers.deepgram.com/docs/model (Nova-3 listed for Pre-recorded + Streaming)
          realtime: true
          batch: true
          # "Diarization is compatible with all Nova batch models (Nova-1, Nova-2, Nova-3) as well as
          #  enhanced and base. Whisper is not supported."  Param is `diarize_model` (`diarize` deprecated).
          # Streaming accepts diarize_model=v1|latest only; v2 is batch-only.
          # https://developers.deepgram.com/docs/diarization
          inline_diarization: true
          # "Keyterm Prompting is available for both monolingual and multilingual transcription using the
          #  Nova-3 Models, as well as Flux." / "Key Terms are limited to 500 tokens per request".
          # Limit is expressed in TOKENS, not terms -> max_terms is null on purpose.
          # https://developers.deepgram.com/docs/keyterm
          glossary: {supported: true, field: keyterm, max_tokens: 500}
          # words[] carries start/end (double, seconds) in both batch and streaming responses.
          # https://developers.deepgram.com/reference/speech-to-text-api/listen-streaming
          word_timestamps: true
          # "Multilingual Code Switching is available on Nova-2, Nova-3, and Flux Multilingual"; language=multi
          # works on both pre-recorded and websocket. https://developers.deepgram.com/docs/multilingual-code-switching
          languages: codeswitch
        deprecated: null

      - id: nova-2
        label: Nova-2
        interactions: [transcribe]
        transcribe:
          # https://developers.deepgram.com/docs/model (Nova-2 listed for Pre-recorded + Streaming)
          realtime: true
          batch: true
          # https://developers.deepgram.com/docs/diarization
          inline_diarization: true
          # "Keywords is only available for use with Nova-2, Nova-1, Enhanced, and Base speech to text models.
          #  For Nova-3, use Keyterm Prompting." / "Keywords are limited to 100 keywords per request."
          # Nova-2 does NOT accept `keyterm`. https://developers.deepgram.com/docs/keywords
          glossary: {supported: true, field: keywords, max_terms: 100}
          word_timestamps: true
          # https://developers.deepgram.com/docs/multilingual-code-switching (language=multi, es/en pair)
          languages: codeswitch
          # No sunset date published anywhere in the docs; `keywords` itself is labelled "Legacy Keywords"
          # in the feature overviews. https://developers.deepgram.com/docs/stt-pre-recorded-feature-overview
        deprecated: null

      - id: flux-general-en
        label: Flux General (English)
        interactions: [transcribe]
        transcribe:
          # Flux is a websocket-only conversational model: wss://api.deepgram.com/v2/listen?model=flux-general-en
          # https://developers.deepgram.com/docs/flux/quickstart
          realtime: true
          # No REST/pre-recorded path documented for Flux and flux-* is absent from the /v1/listen model enum.
          batch: false
          # Diarization page availability badge reads "Pre-recorded  Streaming:Nova  Streaming: Flux",
          # but the model-compatibility sentence names only Nova/enhanced/base. AMBIGUOUS - see report.
          # https://developers.deepgram.com/docs/diarization
          # inline_diarization: <omitted, docs contradictory>
          # "Keyterm Prompting is available ... as well as Flux"; 500-token cap; Flux can also update
          # keyterms mid-stream via the Configure control message.
          # https://developers.deepgram.com/docs/keyterm
          glossary: {supported: true, field: keyterm, max_tokens: 500}
          # "Word-level Timestamps | All available" https://developers.deepgram.com/docs/flux/feature-overview
          word_timestamps: true
          languages: single
        deprecated: null

      - id: flux-general-multi
        label: Flux General (Multilingual)
        interactions: [transcribe]
        transcribe:
          realtime: true
          batch: false
          # inline_diarization: <omitted, docs contradictory - same as flux-general-en>
          glossary: {supported: true, field: keyterm, max_tokens: 500}
          word_timestamps: true
          # "For Flux Multilingual ... handles code-switching natively" (model=flux-general-multi + language_hint)
          # https://developers.deepgram.com/docs/multilingual-code-switching
          # https://developers.deepgram.com/docs/flux/feature-overview (10 languages)
          languages: codeswitch
        deprecated: null
      # Deepgram's hosted Whisper is NOT offered: it is batch only, and this
      # repo has no Deepgram batch connector (only the streaming one, see
      # stt/backends/deepgram.py), so nothing could route a job to it. Nova and
      # Flux are unaffected because they stream, and the streaming connector
      # serves re-processing too by feeding it VAD-chunked utterances.

    # Task-tuned Nova variants (nova-2-meeting, nova-2-phonecall, nova-3-medical
    # and friends) are annotated but not listed: a picker with ten near-identical
    # rows helps nobody, while a config naming one still needs the right answer
    # about diarization and which biasing field to send. Ordered most specific
    # first, since the first match wins.
    # https://developers.deepgram.com/docs/models-languages-overview
    model_patterns:
      - match: "nova-3*"
        interactions: [transcribe]
        transcribe:
          realtime: true
          batch: true
          inline_diarization: true
          word_timestamps: true
          languages: codeswitch
          glossary: {supported: true, field: keyterm, max_tokens: 500}
      - match: "nova-2*"
        interactions: [transcribe]
        transcribe:
          realtime: true
          batch: true
          inline_diarization: true
          word_timestamps: true
          languages: codeswitch
          # Nova-2 does not accept `keyterm`; it takes legacy `keywords`.
          glossary: {supported: true, field: keywords, max_terms: 100}

  assemblyai:
    label: AssemblyAI
    hosting: cloud
    auth: api_key
    # "grab one from your dashboard" / "Your API tokens can be found on the API Keys page of your account dashboard."
    # https://www.assemblyai.com/docs/pre-recorded-audio/getting-started/transcribe-an-audio-file
    key_url: https://www.assemblyai.com/dashboard/api-keys
    # REST base URL (US) https://api.assemblyai.com (EU: https://api.eu.assemblyai.com);
    # streaming is a separate host: wss://streaming.assemblyai.com/v3/ws
    # https://www.assemblyai.com/docs/api-reference/overview  (OpenAPI server: https://api.assemblyai.com)
    base_url: https://api.assemblyai.com
    # No STT model-list endpoint exists. The only /models endpoint in AssemblyAI's OpenAPI specs is
    # GET https://llm-gateway.assemblyai.com/v1/models, which lists LLM Gateway chat models, not STT models.
    catalog_endpoint: null
    interactions: [transcribe]
    models:
      - id: universal-3-5-pro
        label: Universal-3.5 Pro
        interactions: [transcribe]
        # The streaming endpoint's own default too, so naming it here and
        # omitting it from the request would pick the same model.
        default: true
        transcribe:
          # "available for both pre-recorded (async) and streaming use cases"
          # async: speech_models: ["universal-3-5-pro"]; streaming: speech_model=universal-3-5-pro (the default)
          # https://www.assemblyai.com/docs/getting-started/slam-1
          # https://www.assemblyai.com/docs/pre-recorded-audio/select-the-speech-model
          # https://www.assemblyai.com/docs/streaming/select-the-speech-model
          realtime: true
          batch: true
          # async: "Supported models: universal-3-5-pro, universal-2" on the diarization page;
          # streaming: "Diarization is supported on all streaming models". Param is `speaker_labels: true`.
          # https://www.assemblyai.com/docs/pre-recorded-audio/label-speakers
          # https://www.assemblyai.com/docs/streaming/label-speakers-and-separate-channels
          inline_diarization: true
          # `keyterms_prompt`: up to 1,000 words/phrases async (max 6 words per phrase);
          # streaming caps the SAME field at 100 terms, each <= 50 chars. max_terms below is the async number.
          # https://www.assemblyai.com/docs/pre-recorded-audio/universal-3-5-pro/prompting
          # https://www.assemblyai.com/docs/streaming/prompting-and-keyterms
          glossary: {supported: true, field: keyterms_prompt, max_terms: 1000, max_terms_realtime: 100, max_term_chars: 50}
          # "Word timestamps / confidence | Included by default on words[]"; streaming Turn messages carry
          # word-level start/end in ms. https://www.assemblyai.com/docs/api-reference/streaming-api/streaming-api
          word_timestamps: true
          # "18-language support, native code switching" (async and streaming)
          languages: codeswitch
        deprecated: null
      # Universal-2 is NOT offered: async only, and this repo has just the
      # streaming AssemblyAI connector, so a job for it could not be routed.
      # https://www.assemblyai.com/docs/speech-to-text/pre-recorded-audio
      - id: universal-streaming-english
        label: Universal-Streaming English
        interactions: [transcribe]
        transcribe:
          # streaming-only model id, speech_model=universal-streaming-english
          # https://www.assemblyai.com/docs/streaming/select-the-speech-model
          realtime: true
          batch: false
          # "Diarization is supported on all streaming models: universal-3-5-pro, universal-streaming-english,
          #  and universal-streaming-multilingual." https://www.assemblyai.com/docs/streaming/label-speakers-and-separate-channels
          inline_diarization: true
          # keyterms_prompt: max 100 per session, each <= 50 chars (longer terms are ignored; >100 errors).
          # https://www.assemblyai.com/docs/streaming/prompting-and-keyterms
          glossary: {supported: true, field: keyterms_prompt, max_terms: 100, max_term_chars: 50}
          word_timestamps: true
          languages: single
        deprecated: null

      - id: universal-streaming-multilingual
        label: Universal-Streaming Multilingual
        interactions: [transcribe]
        transcribe:
          # https://www.assemblyai.com/docs/streaming/select-the-speech-model
          realtime: true
          batch: false
          # https://www.assemblyai.com/docs/streaming/label-speakers-and-separate-channels
          inline_diarization: true
          # https://www.assemblyai.com/docs/streaming/prompting-and-keyterms
          glossary: {supported: true, field: keyterms_prompt, max_terms: 100, max_term_chars: 50}
          word_timestamps: true
          # 6 languages (en, es, de, fr, pt, it). Docs never claim code-switching for this model, unlike
          # universal-3-5-pro. https://www.assemblyai.com/docs/getting-started/models
          languages: multi
        deprecated: null
  openai:
    label: OpenAI
    hosting: cloud
    auth: api_key
    # https://developers.openai.com/api/docs/api-reference/authentication
    key_url: https://platform.openai.com/settings/organization/api-keys
    base_url: https://api.openai.com/v1
    # GET /v1/models: "Lists the currently available models, and provides basic information
    # about each one such as the owner and availability." No query parameters of any kind --
    # no capability/endpoint/type filter. Each object carries only:
    #   id, object, created, owned_by, shutdown_date (nullable).
    # So it is usable ONLY as (a) an existence check for an id and (b) a deprecation signal via
    # shutdown_date. It cannot tell transcribe vs summarize vs video apart -- this file must.
    # https://developers.openai.com/api/reference/resources/models/methods/list
    catalog_endpoint: https://api.openai.com/v1/models
    # No video: see the note where the sora models would otherwise be listed.
    interactions: [transcribe, summarize]
    models:

      # ---------------------------------------------------------------- transcribe

      # Current recommended batch + realtime workhorse.
      # Endpoints per model card: v1/audio/transcriptions AND v1/realtime/transcription_sessions.
      # (v1/realtime itself is "Not supported" for this model.)
      # https://developers.openai.com/api/docs/models/gpt-transcribe
      - id: gpt-transcribe
        label: GPT Transcribe
        interactions: [transcribe]
        # The batch workhorse, and the model the batch factory already
        # named. It settles the transport for a config that chose nothing:
        # the health probe then hits /models rather than opening a Realtime
        # session, which exercises the same key more cheaply.
        default: true
        transcribe:
          realtime: true
          batch: true
          inline_diarization: false
          # Two mutually exclusive biasing fields: `keywords` (term list -- the real glossary)
          # and `prompt` (free-text context). Guide: "Don't send both fields. Keep each keyword
          # on one line and don't include `<`, `>`, a carriage return, or a line feed."
          # No documented max keyword count or prompt length.
          # https://developers.openai.com/api/docs/guides/speech-to-text
          glossary: {supported: true, field: keywords, max_terms: null}
          # "The `timestamp_granularities[]` parameter is only supported for `whisper-1`."
          # verbose_json is likewise whisper-1 only.
          word_timestamps: false
          # `languages` (plural). ISO 639-1 (en, es, fr), selected ISO 639-3, regional zh locales.
          languages: multi
        deprecated: null

      # Realtime-only, lowest latency, streaming transcript deltas. Recommended default for live.
      # Model card: ONLY v1/realtime/transcription_sessions is supported.
      # https://developers.openai.com/api/docs/models/gpt-live-transcribe
      - id: gpt-live-transcribe
        label: GPT Live Transcribe
        interactions: [transcribe]
        transcribe:
          realtime: true
          batch: false
          inline_diarization: false
          # Realtime guide documents `prompt` only ("Use `prompt` to describe the recording or
          # its setting."); it does not document `keywords` on this path.
          # https://developers.openai.com/api/docs/guides/realtime-transcription
          glossary: {supported: true, field: prompt, max_terms: null}
          word_timestamps: false
          # "gpt-live-transcribe uses `languages` instead of the singular `language` field.
          #  Don't send both."
          languages: multi
        deprecated: null

      # Realtime-only Whisper-lineage streaming model. Docs are thin on its parameters.
      # https://developers.openai.com/api/docs/models/gpt-realtime-whisper
      - id: gpt-realtime-whisper
        label: GPT Realtime Whisper
        interactions: [transcribe]
        transcribe:
          realtime: true
          batch: false
          inline_diarization: false
          # GAP: model card and realtime guide never mention prompt/keywords for this model.
          # glossary omitted deliberately.
          word_timestamps: false
          languages: multi
        deprecated: null

      # THE diarization model. Batch ONLY.
      # Model card is explicit: "Only the Transcription API endpoint (v1/audio/transcriptions)"
      # -- Chat Completions, Assistants, Batch, Fine-tuning AND Realtime are all Not supported.
      # https://developers.openai.com/api/docs/models/gpt-4o-transcribe-diarize
      # Returns response_format=diarized_json -> "segments with `speaker`, `start`, and `end`
      # metadata". Speakers are labelled A, B, C... unless known_speaker_names[] is supplied
      # (up to four 2-10s reference clips via known_speaker_references[]).
      # With stream=true it emits `transcript.text.segment` events carrying the speaker label.
      # For audio > 30s you must set chunking_strategy="auto".
      # https://developers.openai.com/api/docs/guides/speech-to-text
      - id: gpt-4o-transcribe-diarize
        label: GPT-4o Transcribe Diarize
        interactions: [transcribe]
        transcribe:
          realtime: false
          batch: true
          inline_diarization: true
          # "gpt-4o-transcribe-diarize doesn't support prompts." Hard no -- hide the glossary UI.
          glossary: {supported: false, field: null, max_terms: null}
          # diarized_json gives SEGMENT-level start/end, not word-level. No timestamp_granularities.
          word_timestamps: false
          languages: multi
        deprecated: "2027-02-26"

      # Legacy. Realtime here means the v1/realtime session path (input_audio_transcription),
      # NOT v1/realtime/transcription_sessions, which the model card marks "Not supported".
      # https://developers.openai.com/api/docs/models/gpt-4o-transcribe
      - id: gpt-4o-transcribe
        label: GPT-4o Transcribe
        interactions: [transcribe]
        transcribe:
          realtime: true
          batch: true
          inline_diarization: false
          glossary: {supported: true, field: prompt, max_terms: null}
          word_timestamps: false
          languages: multi
          # Announced 2026-08-26. Replace with gpt-transcribe / gpt-live-transcribe.
          # https://developers.openai.com/api/docs/deprecations
        deprecated: "2027-02-26"

      # Legacy. Same endpoint split as gpt-4o-transcribe.
      # https://developers.openai.com/api/docs/models/gpt-4o-mini-transcribe
      - id: gpt-4o-mini-transcribe
        label: GPT-4o Mini Transcribe
        interactions: [transcribe]
        transcribe:
          realtime: true
          batch: true
          inline_diarization: false
          glossary: {supported: true, field: prompt, max_terms: null}
          word_timestamps: false
          languages: multi
        deprecated: "2027-02-26"

      # The ONLY model that gives word/segment timestamps and verbose_json. Batch only.
      # Model card: only v1/audio/transcriptions and v1/audio/translations.
      # https://developers.openai.com/api/docs/models/whisper-1
      - id: whisper-1
        label: Whisper
        interactions: [transcribe]
        transcribe:
          realtime: false
          batch: true
          inline_diarization: false
          # "Prompts have a 224-token limit and provide less control than the
          # recommended transcription model." The limit is in tokens, not terms.
          glossary: {supported: true, field: prompt, max_tokens: 224}
          # "Use `whisper-1` when you need word or segment timestamps. The
          # `timestamp_granularities[]` parameter returns structured timestamp data."
          # Values: segment, word. Requires response_format=verbose_json.
          word_timestamps: true
          # "Whisper supports 98 languages, but accuracy varies by language."
          languages: multi
        deprecated: "2027-02-26"

      # ---------------------------------------------------------------- summarize

      # All three GPT-5.6 flagships share the same envelope; they differ only in price/quality.
      # Endpoints: Chat Completions, Responses, Batch. Realtime/Audio/Video not supported.
      # Reasoning effort on ALL THREE: "none, low, medium (default), high, xhigh, and max".
      # NOTE: "minimal" exists in the API enum but is NOT in the GPT-5.6 per-model list --
      # reference says "Not all reasoning models support every value". Do not offer "minimal" here.
      # https://developers.openai.com/api/reference/python/resources/chat/subresources/completions/methods/create
      #
      # temperature: false on all three. See the report -- official docs are SILENT, but the
      # GPT-5 reasoning family returns 400 "Unsupported value: 'temperature' does not support X
      # with this model. Only the default (1) value is supported." Ship the control hidden.
      #
      # system_prompt: true -- Responses input accepts roles user/assistant/system/developer;
      # "Instructions given with the `developer` or `system` role take precedence over
      # instructions given with the `user` role."
      # https://developers.openai.com/api/reference/resources/responses/methods/create

      # https://developers.openai.com/api/docs/models/gpt-5.6-sol  ($4 / $20 per 1M)
      - id: gpt-5.6-sol
        label: GPT-5.6 Sol
        interactions: [summarize]
        llm:
          reasoning: {supported: true, efforts: [none, low, medium, high, xhigh, max]}
          context_length: 1050000
          max_output_tokens: 128000
          system_prompt: true
          temperature: false

      # https://developers.openai.com/api/docs/models/gpt-5.6-terra  ($2 / $12 per 1M)
      - id: gpt-5.6-terra
        label: GPT-5.6 Terra
        interactions: [summarize]
        llm:
          reasoning: {supported: true, efforts: [none, low, medium, high, xhigh, max]}
          context_length: 1050000
          max_output_tokens: 128000
          system_prompt: true
          temperature: false

      # https://developers.openai.com/api/docs/models/gpt-5.6-luna  ($0.2 / $1.2 per 1M)
      # Cheapest; good default for per-session summaries.
      - id: gpt-5.6-luna
        label: GPT-5.6 Luna
        interactions: [summarize]
        # Cheapest of the family, per the price note above: a summary is one
        # long-context call per session, so this is the one to run by default.
        default: true
        llm:
          reasoning: {supported: true, efforts: [none, low, medium, high, xhigh, max]}
          context_length: 1050000
          max_output_tokens: 128000
          system_prompt: true
          temperature: false

      # Prior generation, still listed and not deprecated. Note the SHORTER effort list:
      # "Reasoning.effort supports: none, low, medium (default), high and xhigh." -- no `max`.
      # https://developers.openai.com/api/docs/models/gpt-5.5
      - id: gpt-5.5
        label: GPT-5.5
        interactions: [summarize]
        llm:
          reasoning: {supported: true, efforts: [none, low, medium, high, xhigh]}
          context_length: 1050000
          max_output_tokens: 128000
          system_prompt: true
          temperature: false

      # ---------------------------------------------------------------- video

      # NO VIDEO MODELS ARE OFFERED FOR OPENAI, deliberately.
      #
      # The Videos API and every sora-2 alias and snapshot were deprecated on
      # 2026-03-24 and are removed from the API on 2026-09-24, with no
      # replacement named. Researched capabilities (durations 4/8/12/16/20,
      # 720p and 1080p pairs, always-on audio, image first frame) are recorded
      # in git history rather than here, because shipping a picker against an
      # endpoint that stops answering this month would only produce failed
      # jobs. The `video` interaction is off this provider for the same reason.
      #
      # OpenRouter proxied one of those models, openai/sora-2-pro, and that
      # entry was removed too, ahead of the same 2026-09-24 date, rather than
      # left to break mid-campaign. Nothing replaces it: OpenRouter's live
      # /videos/models catalogue names no other OpenAI video model, so there is
      # no OpenAI video reachable on the one path this app speaks. Check that
      # catalogue before re-adding one here or under openrouter.
      # https://developers.openai.com/api/docs/deprecations
  openrouter:
    label: OpenRouter
    hosting: cloud
    auth: api_key
    key_url: https://openrouter.ai/settings/keys
    base_url: https://openrouter.ai/api/v1
    catalog_endpoint:
