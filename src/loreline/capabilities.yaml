  gemini:
    label: Google Gemini
    hosting: cloud
    auth: api_key
    key_url: https://aistudio.google.com/api-keys
    key_env: [GEMINI_API_KEY, GOOGLE_API_KEY]
    surfaces:
      transcribe:
        # The Live API authenticates with the key as a URL query parameter, not a header.
        # https://ai.google.dev/gemini-api/docs/live-api/live-transcribe
        realtime: {url: "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent", auth: query_key, overridable: true}
        # Native REST base, `x-goog-api-key` header; the current generation surface is the
        # Interactions API (POST {base}/interactions). It does not serve chat. Its /models
        # is the default health path and grades unlike the OpenAI-compatible sibling below
        # (bad key 400 API_KEY_INVALID, no key 403; verified live), which is why the grading
        # reads the body and not only the status.
        # https://ai.google.dev/gemini-api/docs/transcribe
        batch: {url: "https://generativelanguage.googleapis.com/v1beta", auth: goog_header, overridable: true}
      # Google's OpenAI-compatible shim, a sibling path the native base does not serve: Bearer auth.
      summarize: {url: "https://generativelanguage.googleapis.com/v1beta/openai", auth: bearer, overridable: true}
      # models.list -> Model{name, inputTokenLimit, outputTokenLimit,
      # supportedGenerationMethods[], temperature, maxTemperature, topP, topK, thinking}
      # Read by the staleness check, never offered live: one list for every
      # interaction, and nothing in it says which model transcribes and which
      # chats, so a picker reading it would offer a chat model to transcribe with.
      catalog: {url: "https://generativelanguage.googleapis.com/v1beta/models", auth: goog_header, picker: false}
    # No video: see the note where the Veo models would otherwise be listed.
    interactions: [transcribe, summarize]
    models:
      # ---- TRANSCRIBE ------------------------------------------------------
      # Unary/file variant. GA. Audio <=1h per request, <=30min when diarization
      # or word timestamps are on. 85+ languages, auto-detect + code-switching.
      # Config lives at generation_config.transcription_config.
      - id: gemini-3.5-transcribe
        label: Gemini 3.5 Transcribe
        interactions: [transcribe]
        # The only offered Gemini transcription model: the -live variant is
        # hidden until its connector is verified, and a hidden model may not
        # be a default.
        default: true
        transcribe:
          realtime: false
          batch: true
          inline_diarization: true          # transcription_config.diarization_mode: "speaker", up to 8 speakers
          glossary:
            supported: true
            field: custom_vocabulary        # generation_config.transcription_config.custom_vocabulary
            max_terms: 1000                 # docs: best results with <=100 terms
          word_timestamps: true             # transcription_config.timestamp_granularities: ["word"]
          languages: multi
          # "The API rejects requests that include custom_vocabulary with
          # either feature." Both are supported on their own, so this is the
          # only place the incompatibility can be recorded, and the picker
          # greys out the second toggle once the first is on.
          conflicts:
            - [glossary, inline_diarization]
            - [glossary, word_timestamps]
        deprecated: null
      # Live/streaming variant over the Live API BidiGenerateContent websocket.
      # Sessions capped at 10 minutes. No diarization, no word timestamps.
      - id: gemini-3.5-transcribe-live
        label: Gemini 3.5 Transcribe (Live)
        interactions: [transcribe]
        # VERIFIED against the real service: 45 s of human speech transcribed
        # over the Live connector (stt/backends/gemini_live.py), 438 chars
        # against 516 from gemini-3.5-transcribe on the same audio. The
        # earlier "no transcription frames at all" reading was synthetic
        # speech: server-side VAD gates the pipeline and never hears espeak-ng
        # as speech, so only real human audio proves anything here.
        #
        # Two service behaviours worth knowing before touching the connector,
        # neither of them documented. A turn ends with
        # serverContent.generationComplete, never with turnComplete (not once
        # in 200+ recorded frames). And audio pushed faster than realtime
        # desynchronises the service: it stops finalizing the open turn (223
        # of 438 chars on that clip) and leaves up to 2.34 s of silence
        # between turns, which is why the connector paces its own send rather
        # than trusting whatever pace its caller feeds it at.
        #
        # Live against batch on that same clip: batch 516 chars in 4.0 s, live
        # 438 chars in 45.8 s, since pacing costs the audio's own duration.
        # Live also dropped a whole clause batch got right ("On the 24th of
        # February 1815, the lookout at Notre Dame de la Garde"), missing from
        # the interim frames too, so it is a model difference and not a
        # connector bug. For stored audio the batch model wins on every axis,
        # accuracy, speed, diarization and word timestamps; the live model is
        # for GMs who want the streaming transport.
        hidden: false
        transcribe:
          # realtime/batch name the transport, not what the model may be used
          # for: batch: false says the Live API has no unary endpoint, so this
          # model always routes to the websocket connector. Re-processing
          # stored audio still uses it, which is why that connector has to
          # survive being fed a whole utterance at once.
          realtime: true
          batch: false
          inline_diarization: false         # "not supported in live streaming sessions"
          # VERIFIED, after the connector spent a while asserting the
          # opposite and dropping the GM's glossary on the floor. Probed
          # against the real service, setup only, no audio:
          #   * setup.inputAudioTranscription.customVocabulary -> setupComplete
          #   * the same as custom_vocabulary -> setupComplete
          #   * a made-up sibling zzzNotAField -> 1007 close, 'Unknown name
          #     "zzzNotAField" at "setup.input_audio_transcription": Cannot
          #     find field.' So unknown fields are rejected, not ignored, and
          #     the ack above is evidence rather than silence.
          #   * sent as an object -> 1007 close, "Invalid value at
          #     'setup.input_audio_transcription' (custom_vocabulary),
          #     Starting an object on a scalar field", which names the field.
          #   * at setup top level or under generationConfig -> Cannot find
          #     field. It lives under inputAudioTranscription and nowhere else.
          # It changes the transcript, too, which is what actually settles it:
          # on the Monte Cristo clip, twice each way and byte-identical within
          # each condition, priming these proper nouns turned "Cape Morgion"
          # into "Cape Morgiou", "Rion Island" into "Riou Island" and "the old
          # Foxy docks" into "the old Phocee docks", matching what the batch
          # model returns unprompted.
          glossary:
            supported: true
            field: customVocabulary         # setup.inputAudioTranscription.customVocabulary
            # Enforced, not advisory: 1000 entries ack, 1001 closes the socket
            # with 1007 "custom_vocabulary cannot contain more than 1000
            # entries." Over the cap the whole session dies, not just the
            # surplus, which is why the connector trims before sending.
            max_terms: 1000                 # docs: best results with <=100 terms
          word_timestamps: false            # "not supported over the Live API"; utterance-level only
          languages: multi
        deprecated: null
      # ---- SUMMARIZE -------------------------------------------------------
      #
      # Served through Google's OpenAI-compatible shim, not the native
      # Interactions API: `POST .../v1beta/openai/chat/completions`, which the
      # existing summarizer speaks unchanged once loreline.llm points the kind
      # at that base URL.
      #
      # Every claim below was checked against the live API on 2026-09-02, one
      # request per model per parameter, because a compatibility shim's
      # behaviour is not the vendor doc's behaviour:
      #
      # * temperature is accepted (0.3) by all four, so `temperature: true` is
      #   observed rather than assumed.
      # * `system` role messages are accepted by all four, hence
      #   `system_prompt: true`.
      # * reasoning_effort maps onto Gemini's thinking level and is validated
      #   TWICE - once against the shim's own value set ("Invalid
      #   reasoning_effort: xhigh. Valid values are: high, low, medium,
      #   minimal, none", so OpenAI's `xhigh` and `max` are rejected for every
      #   Gemini model), and once against the model, which is where the lists
      #   below differ from each other.
      #
      # The efforts are per-model observations, NOT a copy of the thinking-page
      # table, which claims a uniform low/medium/high everywhere and is wrong
      # in both directions: it omits `none`, which 3.8 Flash and 3.5 Flash
      # accept, and it does not say that Flash-Lite and 3.1 Pro reject it.
      # https://ai.google.dev/gemini-api/docs/openai
      - id: gemini-3.8-flash
        label: Gemini 3.8 Flash
        interactions: [summarize]
        llm:
          reasoning:
            supported: true
            # 400: "Thinking level MINIMAL is not supported for this model."
            efforts: [none, low, medium, high]
          context_length: 1048576         # models.list inputTokenLimit
          max_output_tokens: 65536        # models.list outputTokenLimit
          system_prompt: true
          temperature: true
      - id: gemini-3.5-flash
        label: Gemini 3.5 Flash
        interactions: [summarize]
        # The summarize default: the only Gemini model that accepts every
        # reasoning effort the OpenAI-compatible shim can send, so it is the
        # one that cannot fail a request over a level carried across from
        # another provider. 3.8-flash rejects "minimal", flash-lite rejects
        # "none", and 3.1-pro rejects both.
        default: true
        llm:
          reasoning:
            supported: true
            # The only Gemini model here that takes the shim's full value set.
            efforts: [none, minimal, low, medium, high]
          context_length: 1048576
          max_output_tokens: 65536
          system_prompt: true
          temperature: true
      - id: gemini-3.5-flash-lite
        label: Gemini 3.5 Flash-Lite
        interactions: [summarize]
        llm:
          reasoning:
            supported: true
            # Rejects effort "none" with a bare "Request contains an invalid
            # argument", so the picker must never offer it.
            mandatory: true
            efforts: [minimal, low, medium, high]
          context_length: 1048576
          max_output_tokens: 65536
          system_prompt: true
          temperature: true
      - id: gemini-3.1-pro-preview
        label: Gemini 3.1 Pro (Preview)
        interactions: [summarize]
        llm:
          reasoning:
            supported: true
            # 400: "Budget 0 is invalid. This model only works in thinking
            # mode." MINIMAL is refused as on 3.8 Flash.
            mandatory: true
            efforts: [low, medium, high]
          context_length: 1048576
          max_output_tokens: 65536
          system_prompt: true
          temperature: true
      # NOT OFFERED YET: no video connector exists for this provider.
      #
      # The research below is current and correct, but this repo cannot serve
      # it: the video client speaks OpenRouter's /videos API
      # (loreline/video/client.py), which Google does not publish - the
      # OpenAI-compatible shim that carries the summarize models above covers
      # chat only. Declaring `video` here would put Gemini in that picker and
      # fail at request time. Veo needs a real connector against the native
      # predict/operations surface; until someone writes one the interaction
      # stays off the provider and these entries stay commented, so the facts
      # are not researched twice.
      #
      # # ---- VIDEO -----------------------------------------------------------
      # # Veo 3.1 family. Audio is always generated and cannot be disabled.
      # # durationSeconds must be 8 for 1080p/4k or when reference images are used.
      # # prompt_max_chars: docs state the limit in TOKENS (1,024), not characters.
      # - id: veo-3.1-generate-preview
      # label: Veo 3.1
      # interactions: [video]
      # video:
      # durations: [4, 6, 8]
      # resolutions: ["720p", "1080p", "4k"]
      # aspect_ratios: ["16:9", "9:16"]
      # audio: true
      # image_input: true
      # prompt_max_chars: null            # documented as 1,024 tokens
      # - id: veo-3.1-fast-generate-preview
      # label: Veo 3.1 Fast
      # interactions: [video]
      # video:
      # durations: [4, 6, 8]
      # resolutions: ["720p", "1080p", "4k"]
      # aspect_ratios: ["16:9", "9:16"]
      # audio: true
      # image_input: true
      # prompt_max_chars: null            # documented as 1,024 tokens
      # - id: veo-3.1-lite-generate-preview
      # label: Veo 3.1 Lite
      # interactions: [video]
      # video:
      # durations: [4, 6, 8]
      # resolutions: ["720p", "1080p"]    # no 4k on Lite
      # aspect_ratios: ["16:9", "9:16"]
      # audio: true
      # image_input: true
      # prompt_max_chars: null            # documented as 1,024 tokens
      #
  openai_compat:
    label: Self-hosted (OpenAI compatible)
    hosting: selfhosted
    auth: optional
    key_url: null
    # No url anywhere: the operator supplies the server's base (".../v1"), which
    # is required, and every surface is that base. The catalogue is the server's
    # own /models list beside it.
    surfaces:
      transcribe:
        batch: {url: null, auth: bearer, overridable: true}
      summarize: {url: null, auth: bearer, overridable: true}
      catalog: {url: "{base_url}/models", auth: bearer, overridable: true}
    interactions: [transcribe, summarize]
    # No curated models, so no `default: true` anywhere below, and none is
    # missing: any id written here would be a guess about a server we have
    # never seen. Every action route carries a chosen model, and the health
    # probe (GET {base_url}/models) names none.
    models: []                # discovered at runtime
    # Ordered most specific first, because find() takes the first match. The
    # English-only rule has to precede the general one or "*whisper*" swallows
    # it and advertises multilingual support these checkpoints do not have.
    #
    # Real Speaches and HuggingFace ids are namespaced
    # ("Systran/faster-distil-whisper-small.en"), so every glob is wrapped in
    # wildcards; a leading-anchored "whisper*" would never match anything.
    model_patterns:
      # English-only checkpoints: do not advertise multilingual.
      - match: "*whisper*.en"
        interactions: [transcribe]
        transcribe:
          batch: true
          word_timestamps: true
          languages: single
          language_codes: [en]
          glossary: {supported: true, field: prompt}
      # Models explicitly built for speaker-attributed output.
      - match: "*diarize*"
        interactions: [transcribe]
        transcribe:
          batch: true
          inline_diarization: true
          word_timestamps: true
          glossary: {supported: true, field: prompt}
      - match: "*whisper*"
        interactions: [transcribe]
        transcribe:
          batch: true
          word_timestamps: true
          glossary: {supported: true, field: prompt}
      # Catch-all, applied to any model this file cannot classify. It is the
      # last entry by design: first match wins, so everything above overrides
      # it. Deliberately conservative except for the glossary - see below.
      - match: "*"
        interactions: [transcribe, summarize]
        transcribe:
          batch: true
          # Needs verbose_json plus timestamp_granularities, which many
          # OpenAI-compatible servers reject outright. Failing closed costs a
          # feature; failing open breaks the request.
          word_timestamps: false
          inline_diarization: false
          # The one place we deliberately fail open: `prompt` is in the base
          # OpenAI spec, so an unknown server accepts it. Worst case it is
          # ignored and quality is unchanged, which is never an error.
          glossary: {supported: true, field: prompt}
        llm:
          # Ollama still defaults num_ctx to 4096, so this is a compromise;
          # override from server metadata where it is reported.
          context_length: 8192
          max_output_tokens: 2048
          system_prompt: true
          temperature: true
