      # ---------------------------------------------------------------- video

      # NO VIDEO MODELS ARE OFFERED FOR OPENAI, deliberately.
      #
      # The Videos API and every sora-2 alias and snapshot were deprecated on
      # 2026-03-24 and are removed from the API on 2026-09-24, with no
      # replacement named. Researched capabilities (durations 4/8/12/16/20,
      # 720p and 1080p pairs, always-on audio, image first frame) are recorded
      # in git history rather than here, because shipping a picker against an
      # endpoint that stops answering this month would only produce failed
      # jobs. The `video` interaction is off this provider for the same reason.
      #
      # OpenRouter proxied one of those models, openai/sora-2-pro, and that
      # entry was removed too, ahead of the same 2026-09-24 date, rather than
      # left to break mid-campaign. Nothing replaces it: OpenRouter's live
      # /videos/models catalogue names no other OpenAI video model, so there is
      # no OpenAI video reachable on the one path this app speaks. Check that
      # catalogue before re-adding one here or under openrouter.
      # https://developers.openai.com/api/docs/deprecations
  openrouter:
    label: OpenRouter
    hosting: cloud
    auth: api_key
    key_url: https://openrouter.ai/settings/keys
    key_env: [OPENROUTER_API_KEY]
    # One gateway base serves all three interactions. Every request carries the
    # two optional attribution headers OpenRouter credits apps with on its public
    # leaderboards (declared once, referenced by anchor). /models is public
    # (verified 2026-09-02: HTTP 200, 425 models, no Authorization header), so the
    # health probe asks /key, which describes the calling key and 401s without one.
    surfaces:
      transcribe:
        batch:
          url: "https://openrouter.ai/api/v1"
          auth: bearer
          overridable: true
          health: /key
          headers: &openrouter_attribution
            HTTP-Referer: "https://github.com/LuckyType/loreline"
            X-Title: Loreline
      summarize: {url: "https://openrouter.ai/api/v1", auth: bearer, overridable: true, health: /key, headers: *openrouter_attribution}
      video: {url: "https://openrouter.ai/api/v1", auth: bearer, overridable: true, headers: *openrouter_attribution}
      # Three disjoint catalogues: the unfiltered /models is the chat list, the
      # transcription list only comes back when asked for, and video has its own.
      catalog:
        summarize: {url: "https://openrouter.ai/api/v1/models", auth: bearer, public: true}
        transcribe: {url: "https://openrouter.ai/api/v1/models?output_modalities=transcription", auth: bearer, public: true}
        video: {url: "https://openrouter.ai/api/v1/videos/models", auth: bearer, public: true}
    live_capture: false        # batch only, cannot drive live capture
    interactions: [transcribe, summarize, video]
