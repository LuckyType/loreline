[project]
name = "loreline"
version = "0.1.0"
description = "Headless tabletop session transcriber: mic capture + pluggable STT/diarization orchestrator with web UI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Loreline" }]
keywords = ["stt", "transcription", "diarization", "tabletop", "rpg"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "httpx>=0.27",
    "typer>=0.12",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "aiosqlite>=0.20",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Native/heavy deps kept optional so base CI (lint/typecheck/test) stays light and
# portable. Installed on the capture device.
audio = [
    "sounddevice>=0.5",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "silero-vad>=5.1",
    # Direct (not just transitive via silero-vad): `[tool.uv.sources]` below
    # only redirects a package's index for direct project dependencies.
    "torch>=2.0",
    "torchaudio>=2.0",
]
# Provider SDKs, installed as connectors land.
providers = [
    "deepgram-sdk>=3.7",
    "assemblyai>=0.35",
    "openai>=1.50",
]
persistence = [
    "aiosqlite>=0.20",  # kept as alias; also a base dependency
]

[project.scripts]
loreline = "loreline.cli:app"

# ----------------------------------------------------------------------------
# torch (pulled in transitively by the `audio` extra's silero-vad) defaults to
# a CUDA-linked build even on aarch64 Linux - several GB of NVIDIA runtime
# libraries that can never be used (no GPU on a Raspberry Pi, nor in a plain
# dev container). Pin it and torchaudio to PyTorch's dedicated CPU-only index
# instead, which publishes wheels for all three platforms this project
# targets: macOS, Linux x86_64 (dev/CI), and Linux aarch64 (the Pi device).
# `explicit = true` keeps this index from being used for any other package.
# ----------------------------------------------------------------------------
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loreline"]

# ----------------------------------------------------------------------------
# Ruff - lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "mocks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async correctness
    "RUF",      # ruff-specific
    "PL",       # pylint subset
    "TID",      # tidy imports
]
ignore = [
    "PLR0913",  # too many args (DI-heavy code)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["loreline", "mocks"]

# ----------------------------------------------------------------------------
# Pyright - strict type checking
# ----------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "mocks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=loreline --cov-report=term-missing"

[tool.coverage.run]
source = ["loreline"]
branch = true
